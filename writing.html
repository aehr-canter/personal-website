---
layout: default
title: Writing
permalink: /writing/
---
<h1 class="post-title" style="font-size:1.6rem; margin-bottom:2rem;">Writing</h1>

<ul class="entry-list">
  {% for post in site.posts %}
  <li class="entry">
    <span class="date">{{ post.date | date: "%b %Y" }}</span>
    <a class="title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
